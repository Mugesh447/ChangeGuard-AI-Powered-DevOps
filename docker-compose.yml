services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: changeguard
      POSTGRES_USER: changeguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeguard-local-password}
    ports:
      - "5432:5432"
    volumes:
      - changeguard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U changeguard -d changeguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "4000:4000"
    environment:
      API_PORT: 4000
      CLIENT_ORIGIN: http://localhost:8080
      JWT_SECRET: ${JWT_SECRET:-changeguard-development-secret}
      DATABASE_PATH: /app/data/changeguard.db
      DATABASE_URL: postgresql://changeguard:${POSTGRES_PASSWORD:-changeguard-local-password}@postgres:5432/changeguard
      DATABASE_SSL: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-}
      MCP_SERVER_TOKEN: ${MCP_SERVER_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - changeguard-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  changeguard:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  changeguard-data:
  changeguard-postgres:
